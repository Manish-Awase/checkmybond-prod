# nginx/nginx.conf
# Nginx reverse proxy for BondQi.
# Sits behind Caddy, which terminates TLS at the real internet-facing edge
# and forwards plain HTTP here over the internal shared network. This
# container is not published to the host directly -- only Caddy reaches it,
# by name (cmb-nginx / bondqi-prod-nginx).
#
# Traffic flow:
#
#   Browser
#     │
#     ▼  HTTPS :443 (Caddy terminates TLS, auto-manages certs)
#   Caddy
#     │
#     ▼  HTTP :80 (internal network only)
#   Nginx (this file)
#     ├── /              → proxy → frontend (Vite dev server)
#     ├── /api/*         → proxy → Go Gateway :9000 (JWT + blacklist + proxy)
#     └── /health         → upstream health check passthrough
#
# No ssl_certificate / ssl_certificate_key here on purpose -- Caddy already
# owns TLS. Duplicating it here would require certs this container doesn't
# have, which is what caused the crash loop this file replaces the fix for.
#
# UPDATE: added a dedicated, tighter rate limit zone (login) specifically
# for /api/auth/login, separate from the general auth zone that still
# covers the rest of /api/auth/ (register, refresh, password reset, etc.).
# nginx always evaluates exact-match location blocks (location =) before
# prefix location blocks (location /api/auth/), regardless of file order,
# so /api/auth/login hits the stricter `login` zone and every other
# /api/auth/* route still falls through to the existing `auth` zone
# unchanged.

worker_processes      auto;           # one worker per CPU core
worker_rlimit_nofile  65535;

events {
    worker_connections  4096;
    use                 epoll;        # Linux-optimized event model
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;          # hide Nginx version from headers

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;         # don't compress tiny responses
    gzip_buffers        16 8k;
    gzip_http_version   1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Keyed by client IP. Defined in http block, applied per-location.

    # Login endpoint — strictest: 5 requests/minute per IP
    # Dedicated zone so brute-force login attempts can be throttled harder
    # without affecting register/refresh/reset traffic under /api/auth/.
    limit_req_zone  $binary_remote_addr  zone=login:10m    rate=5r/m;

    # Auth endpoints (register, refresh, password reset, etc.) — strict:
    # 10 requests/minute per IP
    limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=10r/m;

    # Upload endpoint — moderate: 5 requests/minute per IP
    # Large file uploads + Celery processing — no need for high rate
    limit_req_zone  $binary_remote_addr  zone=upload:10m   rate=5r/m;

    # General API — relaxed: 60 requests/second per IP
    # Covers polling (/api/extractions/{id} every 2s), dashboard, etc.
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=60r/s;

    # Public contact form — no auth required to reach this endpoint, so
    # it needs its own protection against spam/abuse, separate from the
    # authenticated-traffic zones above.
    limit_req_zone  $binary_remote_addr  zone=contact:10m  rate=3r/m;

    # ── Upstream: Go Gateway ──────────────────────────────────────────────────
    upstream cmb_gateway {
        server  gateway:9000;

        # ── Load balancing (uncomment to enable) ─────────────────────────────
        # server  gateway2:9000;
        # server  gateway3:9000;
        # least_conn;

        keepalive  32;
    }

    # ── Upstream: React frontend (Vite dev) ───────────────────────────────────
    # In production, replace this block with a static files root instead.
    upstream cmb_frontend {
        server  frontend:5173;
        keepalive  16;
    }

    # ── Main server — plain HTTP only. Caddy terminates TLS upstream. ─────────
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        # ── Security headers ──────────────────────────────────────────────────
        # HSTS intentionally NOT set here — meaningless without also being the
        # TLS-terminating layer; Caddy already adds it once, at the real edge.
        add_header X-Frame-Options           "SAMEORIGIN"   always;
        add_header X-Content-Type-Options    "nosniff"      always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── Request size limits ───────────────────────────────────────────────
        client_max_body_size     55m;
        client_body_timeout      120s;
        client_header_timeout    30s;

        # ── Login endpoint — strictest rate limit ─────────────────────────────
        # Exact match: evaluated before the /api/auth/ prefix block below,
        # regardless of declaration order.
        location = /api/auth/login {
            limit_req  zone=login  burst=3  nodelay;
            limit_req_status  429;

            proxy_pass         http://cmb_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
        }

        # ── Auth endpoints — strict rate limit ────────────────────────────────
        location /api/auth/ {
            limit_req  zone=auth  burst=5  nodelay;
            limit_req_status  429;

            proxy_pass         http://cmb_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
        }

        # ── Public contact form — no auth, tight rate limit ───────────────────
        location = /api/contact {
            limit_req  zone=contact  burst=2  nodelay;
            limit_req_status  429;

            proxy_pass         http://cmb_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            proxy_read_timeout  15s;
            proxy_send_timeout  15s;
        }

        # ── OCR folder upload — large body, very long timeout ─────────────────
        location /api/documents/upload-ocr {
            limit_req  zone=upload  burst=2  nodelay;
            limit_req_status  429;

            client_max_body_size  5120m;

            proxy_read_timeout    1800s;   # 30 minutes
            proxy_send_timeout    1800s;
            client_body_timeout   1800s;

            proxy_request_buffering  off;
            proxy_buffering          off;

            proxy_pass         http://cmb_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        # ── Upload endpoint — moderate rate limit + long timeout ──────────────
        location /api/documents/upload {
            limit_req  zone=upload  burst=3  nodelay;
            limit_req_status  429;

            proxy_pass         http://cmb_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            proxy_read_timeout  300s;   # 5 min — large PDF uploads need time
            proxy_send_timeout  300s;
            proxy_request_buffering off;  # stream body directly, don't buffer in nginx
        }

        # ── General API — relaxed rate limit ──────────────────────────────────
        location /api/ {
            limit_req  zone=api  burst=20  nodelay;
            limit_req_status  429;

            proxy_pass         http://cmb_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # ── Health check — no rate limit, no auth ─────────────────────────────
        location /health {
            proxy_pass         http://cmb_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 5s;
            access_log         off;     # don't pollute access log with healthchecks
        }

        # ── Static frontend files (production build) ──────────────────────────
        # Used when frontend/dist/ is mounted into Nginx. Comment the block
        # below (Vite dev proxy) and uncomment this instead for a prod build.
        #
        # location / {
        #     root       /usr/share/nginx/html;
        #     try_files  $uri $uri/ /index.html;   # SPA fallback — all routes → index.html
        #
        #     location ~* \.(js|css|woff|woff2|png|jpg|ico|svg)$ {
        #         expires     1y;
        #         add_header  Cache-Control "public, immutable";
        #     }
        #
        #     location = /index.html {
        #         add_header  Cache-Control "no-cache, no-store, must-revalidate";
        #     }
        # }

        # ── Frontend proxy (Vite dev server) ─────────────────────────────────
        # Used in development — proxies to Vite's hot-reload server.
        # In production, comment this out and use the static block above.
        location / {
            proxy_pass          http://cmb_frontend;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade     $http_upgrade;
            proxy_set_header    Connection  "upgrade";  # required for Vite HMR websocket
            proxy_set_header    Host        $host;
            proxy_set_header    X-Real-IP   $remote_addr;
            proxy_read_timeout  86400s;     # keep HMR websocket alive
            proxy_send_timeout  86400s;
        }

        # ── Custom error pages ────────────────────────────────────────────────
        error_page  429  /429.json;
        location = /429.json {
            internal;
            default_type  application/json;
            return 429 '{"detail":"Too many requests — slow down"}';
        }

        error_page  502 503 504  /50x.json;
        location = /50x.json {
            internal;
            default_type  application/json;
            return 502 '{"detail":"Service temporarily unavailable"}';
        }
    }
}
