# /etc/fail2ban/filter.d/nginx-auth.conf
#
# Matches 401 (bad credentials) and 429 (rate-limit exceeded) responses on
# any /api/auth/* route -- login, register, forgot-password, oauth, etc.
# Built against the `main` log_format used in nginx.conf:
#   '$remote_addr - $remote_user [$time_local] '
#   '"$request" $status $body_bytes_sent '
#   '"$http_referer" "$http_user_agent" '
#   'rt=$request_time ut=$upstream_response_time'
#
# Example line this matches:
#   1.2.3.4 - - [27/Aug/2026:10:00:00 +0000] "POST /api/auth/login HTTP/1.1" 401 58 "-" "curl/8.0" rt=0.011 ut=0.009

[Definition]
failregex = ^<HOST> - \S+ \[.*\] "(?:GET|POST|PUT|PATCH|DELETE) /api/auth/\S* HTTP/\d\.\d" (?:401|429) \d+ ".*" ".*" rt=\S+ ut=\S+$

ignoreregex =
