# nginx/nginx.conf
# Nginx reverse proxy for project11-docker.
# Sits in front of the Go gateway — handles TLS, rate limiting,
# gzip, static file serving, and load balancing.
#
# Traffic flow with Nginx:
#
#   Browser
#     │
#     ▼  HTTPS :443 (or HTTP :80 → redirect)
#   Nginx
#     ├── /              → serves React build (static files)
#     ├── /api/*         → proxy → Go Gateway :9000 (JWT + blacklist + proxy)
#     └── /health        → upstream health check passthrough
#

# ── Worker config ─────────────────────────────────────────────────────────────
worker_processes      auto;           # one worker per CPU core
worker_rlimit_nofile  65535;

events {
    worker_connections  4096;
    use                 epoll;        # Linux-optimized event model
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;          # hide Nginx version from headers

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;         # don't compress tiny responses
    gzip_buffers        16 8k;
    gzip_http_version   1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Keyed by client IP. Defined in http block, applied per-location.

    # Auth endpoints — strict: 10 requests/minute per IP
    # Login gets its own tighter zone below; this covers the rest of
    # /api/auth/ (register, forgot-password, reset-password, oauth, etc.)
    # Prevents brute-force login attacks
    limit_req_zone  $binary_remote_addr  zone=login:10m    rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=10r/m;

    # Upload endpoint — moderate: 5 requests/minute per IP
    # Large file uploads + Celery processing — no need for high rate
    limit_req_zone  $binary_remote_addr  zone=upload:10m   rate=5r/m;

    # General API — relaxed: 60 requests/second per IP
    # Covers polling (/api/extractions/{id} every 2s), dashboard, etc.
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=60r/s;

    # ── Upstream: Go Gateway ──────────────────────────────────────────────────
    # Single upstream block — swap to multiple servers for load balancing
    upstream hitl_gateway {
        # Primary gateway
        server  gateway:9000;

        # ── Load balancing (uncomment to enable) ─────────────────────────────
        # Add more gateway replicas here. Nginx uses round-robin by default.
        # server  gateway2:9000;
        # server  gateway3:9000;

        # Least-connections balancing — better for long-running uploads:
        # least_conn;

        # Keepalive connections to gateway (reduces TCP overhead)
        keepalive  32;
    }

    # ── Upstream: React frontend (Vite dev) ───────────────────────────────────
    # In production, replace this block with a static files root instead.
    upstream hitl_frontend {
        server  frontend:5173;
        keepalive  16;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;           # catch-all — replace with your domain

        # Let's Encrypt ACME challenge passthrough (if using certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────────────────────
    server {
        # listen       443 ssl http2;   #replacing below 3 line
        # listen       [::]:443 ssl http2; #replacing below 3 line
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  _;           # replace with your actual domain

        # ── TLS certificates ──────────────────────────────────────────────────
        # For local dev: use self-signed (see ssl/README below)
        # For production: use Let's Encrypt / certbot
        ssl_certificate       /etc/nginx/ssl/cert.pem;
        ssl_certificate_key   /etc/nginx/ssl/key.pem;

        # Modern TLS settings — disables old TLS 1.0/1.1
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # HSTS — tells browsers to always use HTTPS for 1 year
        # Only enable once you're sure HTTPS works correctly
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options           "SAMEORIGIN"   always;
        add_header X-Content-Type-Options    "nosniff"      always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── Request size limits ───────────────────────────────────────────────
        # Global default — covers normal API requests and schema uploads
        client_max_body_size     55m;
        client_body_timeout      120s;
        client_header_timeout    30s;

        # ── Login endpoint — strictest rate limit ─────────────────────────────
        # Exact match: evaluated before the /api/auth/ prefix block below,
        # regardless of declaration order.
        location = /api/auth/login {
            limit_req  zone=login  burst=3  nodelay;
            limit_req_status  429;

            proxy_pass         http://hitl_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
        }

        # ── Auth endpoints — strict rate limit ────────────────────────────────
        location /api/auth/ {
            limit_req  zone=auth  burst=5  nodelay;
            limit_req_status  429;

            proxy_pass         http://hitl_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
        }

        # ── OCR folder upload — large body, very long timeout ─────────────────
        # Handles folder uploads of up to 100 PDFs × 50MB each.
        # Go handler streams files one-by-one so the connection stays open
        # for the full duration. If connection drops, Go returns partial results
        # (HTTP 206) with list of files already queued.
        location /api/documents/upload-ocr {
            limit_req  zone=upload  burst=2  nodelay;
            limit_req_status  429;

            # Large body — 100 PDFs × 50MB = 5GB theoretical max.
            # In practice Go enforces MAX_BATCH_PDFS=100 and MAX_PDF_SIZE=50MB.
            client_max_body_size  5120m;

            # Long timeout — large folder uploads take time.
            # Go processes files one-by-one and keeps the connection alive
            # by streaming the response only at the end.
            proxy_read_timeout    1800s;   # 30 minutes
            proxy_send_timeout    1800s;
            client_body_timeout   1800s;

            # Do NOT buffer — stream directly to Go, which streams to disk.
            # Buffering in Nginx would load everything into RAM first.
            proxy_request_buffering  off;
            proxy_buffering          off;

            proxy_pass         http://hitl_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Upload endpoint — moderate rate limit + long timeout ──────────────
        location /api/documents/upload {
            limit_req  zone=upload  burst=3  nodelay;
            limit_req_status  429;

            proxy_pass         http://hitl_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  300s;   # 5 min — large PDF uploads need time
            proxy_send_timeout  300s;
            proxy_request_buffering off;  # stream body directly, don't buffer in nginx
        }

        # ── General API — relaxed rate limit ──────────────────────────────────
        location /api/ {
            limit_req  zone=api  burst=20  nodelay;
            limit_req_status  429;

            proxy_pass         http://hitl_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
        }

        # ── Health check — no rate limit, no auth ─────────────────────────────
        location /health {
            proxy_pass         http://hitl_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 5s;
            access_log         off;     # don't pollute access log with healthchecks
        }

        # ── Static frontend files (production build) ──────────────────────────
        # Used when frontend/dist/ is mounted into Nginx.
        # In dev mode (Vite running), comment this block out and use
        # the / proxy block below instead.
        #
        # location / {
        #     root       /usr/share/nginx/html;
        #     try_files  $uri $uri/ /index.html;   # SPA fallback — all routes → index.html
        #
        #     # Cache static assets aggressively
        #     location ~* \.(js|css|woff|woff2|png|jpg|ico|svg)$ {
        #         expires     1y;
        #         add_header  Cache-Control "public, immutable";
        #     }
        #
        #     # Don't cache index.html — always check for new app version
        #     location = /index.html {
        #         add_header  Cache-Control "no-cache, no-store, must-revalidate";
        #     }
        # }

        # ── Frontend proxy (Vite dev server) ─────────────────────────────────
        # Used in development — proxies to Vite's hot-reload server.
        # In production, comment this out and use the static block above.
        location / {
            proxy_pass          http://hitl_frontend;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade     $http_upgrade;
            proxy_set_header    Connection  "upgrade";  # required for Vite HMR websocket
            proxy_set_header    Host        $host;
            proxy_set_header    X-Real-IP   $remote_addr;
            proxy_read_timeout  86400s;     # keep HMR websocket alive
            proxy_send_timeout  86400s;
        }

        # ── Custom error pages ────────────────────────────────────────────────
        error_page  429  /429.json;
        location = /429.json {
            internal;
            default_type  application/json;
            return 429 '{"detail":"Too many requests — slow down"}';
        }

        error_page  502 503 504  /50x.json;
        location = /50x.json {
            internal;
            default_type  application/json;
            return 502 '{"detail":"Service temporarily unavailable"}';
        }
    }
}
