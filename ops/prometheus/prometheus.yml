# ops/prometheus/prometheus.yml
#
# Scrape config for the BondQi platform. Points at the four processes
# that expose /metrics: the API server, the edge gateway, and however
# many Celery worker replicas you run (each on its own METRICS_PORT).
#
# Targets use service names on the app's `cmb-net` Docker network
# (Prometheus is attached to it in docker-compose.observability.yml).
# If you ever run the app processes directly on the host instead, switch
# them back to host.docker.internal:<port>.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/bondqi-alerts.yml"

# Sends firing alerts to Alertmanager, which emails them
# (see ops/alertmanager/alertmanager.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cmb-server
    metrics_path: /metrics
    static_configs:
      - targets: ["cmb-server:8000"]
        labels: { service: cmb-server }
    # Uncomment and set if METRICS_TOKEN is set on the server:
    # bearer_token: "replace-me"

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9000"]
        labels: { service: gateway }

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      # One target per Celery worker replica. Add a line per worker if
      # you run more than one, each with a distinct METRICS_PORT.
      - targets: ["celery-worker:9200"]
        labels: { service: worker }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# ── If using docker-compose.observability.yml instead ───────────────────────
# Replace the static_configs above with:
#
#   - job_name: cmb-server
#     static_configs:
#       - targets: ["cmb-server:8000"]
#         labels: { service: cmb-server }
#   - job_name: gateway
#     static_configs:
#       - targets: ["gateway:9000"]
#         labels: { service: gateway }
#   - job_name: worker
#     static_configs:
#       - targets: ["worker:9200"]
#         labels: { service: worker }
