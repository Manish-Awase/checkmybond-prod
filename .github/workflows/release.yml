name: Build & Release BondQi
#
# Repo layout this workflow assumes (siblings under repo root):
#   backend/             -- shared Python source. Website Celery workers use
#                            all of it; the cli_desktop sidecar below is built
#                            from workers/cli_desktop.py, whose own import
#                            graph only reaches services/ocr_extractor.py,
#                            services/parser_service.py, services/schema_models.py,
#                            and utils/__init__.py -- PyInstaller freezes only
#                            what's actually imported, so LLM/RAG/DB/Celery/
#                            Redis/Groq/boto3 code never ends up in the
#                            desktop binary even though it lives in the same
#                            folder. Verified explicitly below, not just assumed.
#   tauri-app/            -- Tauri project (package.json, src-tauri/)
#   tauri-app/frontend/   -- Vite/React frontend, built by beforeBuildCommand
#                            in tauri.conf.json -- NOT a separate step here.
#
# Publishes to a SEPARATE public repo (RELEASES_REPO below) instead of this
# one -- this repo stays private while release assets live somewhere
# publicly downloadable, since Tauri's updater plugin can't send an auth
# token with its background update checks.
#
# Set these three GitHub Actions secrets before this will work:
#   TAURI_SIGNING_PRIVATE_KEY          -- from `npm run tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD -- the password you set for that key
#   RELEASES_REPO_TOKEN                -- fine-grained PAT scoped to ONLY
#     your releases repo, Contents: Read and write. GITHUB_TOKEN can't be
#     used here -- it's only valid for the repo the workflow runs in.
#
# Also make sure plugins.updater.pubkey in tauri.conf.json is the REAL
# public key matching TAURI_SIGNING_PRIVATE_KEY, not a placeholder --
# a placeholder makes the updater silently reject every future update.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.1.1)"
        required: false
        default: ""

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  APP_NAME: BondQi
  RELEASES_REPO: manish-awase/bondqi-releases

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Build the cli_desktop sidecar (PyInstaller) + the Tauri app itself,
  # both native to each matrix leg, then sign the Tauri bundle.
  # ═══════════════════════════════════════════════════════════════
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ──
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_dir: nsis
            ext: .exe
            args: ""
            arch: x86_64

          # ── macOS Intel ──
          # macos-13 (Intel), NOT macos-latest (Apple Silicon). PyInstaller
          # cannot cross-compile between architectures -- unlike rustc, it
          # always builds for the host it runs on.
          - platform: macos-13
            target: x86_64-apple-darwin
            bundle_dir: dmg
            ext: .dmg
            args: "--target x86_64-apple-darwin"
            arch: x86_64

          # ── macOS Apple Silicon ──
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundle_dir: dmg
            ext: .dmg
            args: "--target aarch64-apple-darwin"
            arch: aarch64

          # ── Linux x86_64 ──
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_dir: appimage
            ext: .AppImage
            args: ""
            arch: x86_64

          # ── Linux ARM64 ──
          # Must run on real arm64 hardware for the same PyInstaller reason
          # as macOS above. Confirm your org has access to this hosted
          # runner label before relying on it; otherwise point this at a
          # self-hosted arm64 runner or drop this leg for now.
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundle_dir: appimage
            ext: .AppImage
            args: ""
            arch: aarch64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tauri-app/package-lock.json
            tauri-app/frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # ── cli_desktop sidecar (built from repo-root backend/, sibling of tauri-app/) ──

      - name: Install backend + PyInstaller dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build cli_desktop sidecar
        working-directory: backend
        shell: bash
        run: |
          pyinstaller --onefile --name cli_desktop \
            --exclude-module services.table_tagger \
            --exclude-module services.normalizer \
            --exclude-module services.vector_store \
            --exclude-module services.extractor \
            --exclude-module services.evaluator \
            --exclude-module services.confidence_gate \
            --exclude-module services.schema_service \
            --exclude-module services.prompt_registry \
            --exclude-module services.reextractor \
            --exclude-module services.template_matcher \
            --exclude-module services.template_matcher_preflight \
            --exclude-module services.template_learning \
            --exclude-module services.reconciliation_engine \
            --exclude-module services.bond_extractor \
            --exclude-module services.ocr_extractor \
            --exclude-module utils.timing \
            --exclude-module utils.db_pool \
            --exclude-module utils.db_backup \
            --exclude-module groq \
            --exclude-module anthropic \
            --exclude-module boto3 \
            --exclude-module sqlalchemy \
            --exclude-module celery \
            --exclude-module redis \
            workers/cli_desktop.py

          echo "Verifying no server-only dependency leaked into the sidecar..."
          if grep -iE "groq|boto3|celery[^_]|anthropic|sqlalchemy|redis" build/cli_desktop/warn-cli_desktop.txt; then
            echo "::error::Server-only dependency detected in cli_desktop sidecar build — aborting."
            exit 1
          fi

          mkdir -p ../tauri-app/src-tauri/binaries
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp dist/cli_desktop.exe ../tauri-app/src-tauri/binaries/cli_desktop-${{ matrix.target }}.exe
          else
            cp dist/cli_desktop ../tauri-app/src-tauri/binaries/cli_desktop-${{ matrix.target }}
          fi

      # ── Tauri app itself ──
      # Frontend build itself happens automatically via beforeBuildCommand
      # in tauri.conf.json (npm run build, cwd ../frontend) -- only need
      # to install deps for both package.json files here first.

      - name: Install Tauri project dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Install frontend dependencies
        working-directory: tauri-app/frontend
        run: npm ci

      - name: Build & sign Tauri app
        working-directory: tauri-app
        run: npm run tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect bundle + signature with version in the filename
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          fi
          VERSION="${VERSION#v}"

          SRC_DIR="tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle_dir }}"
          if [ ! -d "$SRC_DIR" ]; then
            SRC_DIR="tauri-app/src-tauri/target/release/bundle/${{ matrix.bundle_dir }}"
          fi

          mkdir -p artifacts
          for f in "$SRC_DIR"/*${{ matrix.ext }}; do
            [ -e "$f" ] || continue
            NEWNAME="${{ env.APP_NAME }}_${VERSION}_${{ matrix.arch }}${{ matrix.ext }}"
            cp "$f" "artifacts/$NEWNAME"
            echo "Copied: $f -> artifacts/$NEWNAME"
            if [ -e "$f.sig" ]; then
              cp "$f.sig" "artifacts/$NEWNAME.sig"
              echo "Copied signature: $f.sig -> artifacts/$NEWNAME.sig"
            else
              echo "::warning::No .sig file found for $f -- check TAURI_SIGNING_PRIVATE_KEY is set and bundle.createUpdaterArtifacts is true in tauri.conf.json"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════
  # Build the unified latest.json updater manifest.
  # ═══════════════════════════════════════════════════════════════
  build-manifest:
    needs: build-tauri
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          fi
          echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: app-*

      - name: Build latest.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RELEASE_BASE="https://github.com/${{ env.RELEASES_REPO }}/releases/download/v${VERSION}"

          python3 - "$VERSION" "$PUB_DATE" "$RELEASE_BASE" "${{ env.APP_NAME }}" <<'PYEOF'
          import json, sys

          version, pub_date, base, app_name = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]

          def sig(platform, arch, ext):
              path = f"artifacts/app-{platform}-{arch}/{app_name}_{version}_{arch}{ext}.sig"
              try:
                  with open(path) as f:
                      return f.read().strip()
              except FileNotFoundError:
                  return None

          entries = [
              ("windows-x86_64", "windows-latest", "x86_64", ".exe"),
              ("darwin-x86_64",  "macos-13",       "x86_64", ".dmg"),
              ("darwin-aarch64", "macos-latest",   "aarch64", ".dmg"),
              ("linux-x86_64",   "ubuntu-22.04",   "x86_64", ".AppImage"),
              ("linux-aarch64",  "ubuntu-22.04-arm", "aarch64", ".AppImage"),
          ]

          platforms = {}
          for key, platform, arch, ext in entries:
              signature = sig(platform, arch, ext)
              if signature is None:
                  print(f"::warning::No signature found for {key}, omitting from latest.json")
                  continue
              platforms[key] = {
                  "signature": signature,
                  "url": f"{base}/{app_name}_{version}_{arch}{ext}",
              }

          manifest = {
              "version": version,
              "notes": f"See the full changelog at {base.rsplit('/releases/', 1)[0]}/releases/tag/v{version}",
              "pub_date": pub_date,
              "platforms": platforms,
          }

          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: latest.json

  # ═══════════════════════════════════════════════════════════════
  # Publish to the separate public releases repo.
  # ═══════════════════════════════════════════════════════════════
  publish-to-releases-repo:
    needs: [build-tauri, build-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release in releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: v${{ needs.build-manifest.outputs.version }}
          name: ${{ env.APP_NAME }} v${{ needs.build-manifest.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/app-*/${{ env.APP_NAME }}_*
            artifacts/latest-json/latest.json
